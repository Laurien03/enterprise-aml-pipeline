<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Compliance Risk Fusion — Final Report</title>
    <style>
      :root {
        --bg-0: #050b14;
        --bg-1: #0a1420;
        --panel: #101c2e;
        --panel-border: #1e2d45;
        --cyan: #22d3ee;
        --blue: #3b82f6;
        --amber: #f5b942;
        --text-primary: #e6edf5;
        --text-muted: #6b7d99;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: radial-gradient(
          ellipse at 50% 30%,
          var(--bg-1) 0%,
          var(--bg-0) 65%
        );
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text-primary);
        overflow: hidden;
      }
      .stage {
        position: relative;
        width: 100%;
        height: 100vh;
        min-height: 520px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .grid-overlay {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(34, 211, 238, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(34, 211, 238, 0.045) 1px, transparent 1px);
        background-size: 36px 36px;
        mask-image: radial-gradient(
          ellipse at 50% 45%,
          black 10%,
          transparent 72%
        );
        pointer-events: none;
      }
      .header {
        position: absolute;
        top: 22px;
        left: 26px;
        line-height: 1.3;
        pointer-events: none;
      }
      .header .eyebrow {
        font-size: 16px;
        color: var(--text-muted);
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      .header .throughput {
        font-family:
          "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", monospace;
        font-size: 32px;
        color: var(--amber);
        font-variant-numeric: tabular-nums;
        margin-top: 4px;
      }
      .header .throughput span {
        color: var(--text-muted);
        font-size: 15px;
        margin-left: 8px;
      }
      .info-panel {
        position: absolute;
        bottom: 22px;
        right: 26px;
        width: min(360px, 44vw);
        background: rgba(16, 28, 46, 0.86);
        border: 1px solid var(--panel-border);
        border-radius: 10px;
        padding: 16px 18px;
        backdrop-filter: blur(6px);
        transition: border-color 0.25s ease;
      }
      .info-panel.lit {
        border-color: rgba(245, 185, 66, 0.55);
      }
      .info-panel .title {
        font-size: 18px;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 6px;
      }
      .info-panel .rate {
        font-family: "SF Mono", SFMono-Regular, Consolas, monospace;
        font-size: 15px;
        color: var(--amber);
        margin-bottom: 8px;
      }
      .info-panel .desc {
        font-size: 14.5px;
        line-height: 1.55;
        color: var(--text-muted);
      }
      svg {
        width: 100%;
        height: 100%;
        max-width: 1000px;
      }
      .shield-fill {
        fill: rgba(16, 28, 46, 0.6);
      }
      .shield-border {
        fill: none;
        stroke: var(--cyan);
        stroke-width: 2;
      }
      .ring {
        fill: none;
        stroke: rgba(34, 211, 238, 0.28);
        stroke-width: 1;
      }
      .spoke {
        stroke: rgba(34, 211, 238, 0.18);
        stroke-width: 1;
      }
      .trail {
        stroke: var(--cyan);
      }
      .lead-line {
        stroke: var(--cyan);
        stroke-width: 2.2;
      }
      .clear-dot {
        fill: rgba(34, 211, 238, 0.4);
      }
      .flag-dot {
        fill: var(--amber);
        cursor: pointer;
      }
      .flag-ring {
        fill: none;
        stroke: var(--amber);
      }
      .flag-hit {
        fill: transparent;
        cursor: pointer;
      }
      .radar-label {
        font-family: "SF Mono", SFMono-Regular, Consolas, monospace;
        font-size: 14px;
        font-weight: 700;
        fill: var(--amber);
        pointer-events: none;
      }
      .caption {
        font-size: 11.5px;
        fill: var(--text-muted);
        text-anchor: middle;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="grid-overlay"></div>

      <div class="header">
        <div class="eyebrow">Stage 4 · Compliance Risk Fusion</div>
        <div class="throughput" id="throughput">
          0 <span>open compliance cases</span>
        </div>
      </div>

      <div class="info-panel" id="infoPanel">
        <div class="title" id="infoTitle">Compliance Radar</div>
        <div class="rate" id="infoRate">Continuous anomaly scan</div>
        <div class="desc" id="infoDesc">
          Hover a flagged account to see why it's under active review.
        </div>
      </div>

      <svg
        viewBox="0 0 1000 680"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-label="Rotating compliance radar inside a glowing shield, sweeping across hundreds of monitored accounts with a handful flagged"
      >
        <defs>
          <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="7" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <text x="500" y="34" class="caption">
          Fusion output · continuous 360° scan
        </text>

        <!-- shield container -->
        <g filter="url(#softGlow)">
          <path
            class="shield-fill"
            d="M280,180 C280,130 380,100 500,125 C620,100 720,130 720,180 L720,400 C720,510 620,590 500,630 C380,590 280,510 280,400 Z"
          />
          <path
            class="shield-border"
            d="M280,180 C280,130 380,100 500,125 C620,100 720,130 720,180 L720,400 C720,510 620,590 500,630 C380,590 280,510 280,400 Z"
          >
            <animate
              attributeName="stroke-opacity"
              values="0.55;1;0.55"
              dur="3.2s"
              repeatCount="indefinite"
            />
          </path>
        </g>

        <!-- radar face -->
        <g id="radarFace">
          <circle class="ring" cx="500" cy="340" r="190" />
          <circle class="ring" cx="500" cy="340" r="142" />
          <circle class="ring" cx="500" cy="340" r="95" />
          <circle class="ring" cx="500" cy="340" r="47" />
        </g>
        <g id="spokeLayer"></g>
        <g id="dotLayer"></g>

        <!-- rotating sweep: fading trail + bright leading edge -->
        <g id="sweepGroup" filter="url(#glow)">
          <line
            class="trail"
            x1="500"
            y1="340"
            x2="410.79"
            y2="172.25"
            stroke-width="1"
            stroke-opacity="0.08"
          />
          <line
            class="trail"
            x1="500"
            y1="340"
            x2="422.73"
            y2="166.43"
            stroke-width="1.1"
            stroke-opacity="0.16"
          />
          <line
            class="trail"
            x1="500"
            y1="340"
            x2="435.02"
            y2="161.46"
            stroke-width="1.2"
            stroke-opacity="0.26"
          />
          <line
            class="trail"
            x1="500"
            y1="340"
            x2="447.64"
            y2="157.35"
            stroke-width="1.3"
            stroke-opacity="0.38"
          />
          <line
            class="trail"
            x1="500"
            y1="340"
            x2="460.5"
            y2="154.16"
            stroke-width="1.5"
            stroke-opacity="0.52"
          />
          <line
            class="trail"
            x1="500"
            y1="340"
            x2="473.55"
            y2="151.84"
            stroke-width="1.7"
            stroke-opacity="0.68"
          />
          <line
            class="trail"
            x1="500"
            y1="340"
            x2="486.74"
            y2="150.45"
            stroke-width="1.9"
            stroke-opacity="0.84"
          />
          <line class="lead-line" x1="500" y1="340" x2="500" y2="150" />
          <animateTransform
            attributeName="transform"
            type="rotate"
            from="0 500 340"
            to="360 500 340"
            dur="4s"
            repeatCount="indefinite"
          />
        </g>

        <g id="labelLayer"></g>
      </svg>
    </div>

    <script>
      (function () {
        var svgns = "http://www.w3.org/2000/svg";
        var spokeLayer = document.getElementById("spokeLayer");
        var dotLayer = document.getElementById("dotLayer");
        var labelLayer = document.getElementById("labelLayer");
        var cx = 500,
          cy = 340,
          R = 190,
          sweepDur = 4; // seconds, matches sweepGroup animateTransform

        // static radar spokes every 45deg
        for (var a = 0; a < 360; a += 45) {
          var rad = (a * Math.PI) / 180;
          var x2 = cx + R * Math.sin(rad),
            y2 = cy - R * Math.cos(rad);
          var line = document.createElementNS(svgns, "line");
          line.setAttribute("x1", cx);
          line.setAttribute("y1", cy);
          line.setAttribute("x2", x2);
          line.setAttribute("y2", y2);
          line.setAttribute("class", "spoke");
          spokeLayer.appendChild(line);
        }

        function polar(angleDeg, rFrac) {
          var rad = (angleDeg * Math.PI) / 180;
          var r = R * rFrac;
          return { x: cx + r * Math.sin(rad), y: cy - r * Math.cos(rad) };
        }

        // simple profile-silhouette icon: head circle + shoulder arc, anchored at its own center
        function addProfileIcon(parent, x, y, size, cls, filterUrl) {
          var g = document.createElementNS(svgns, "g");
          g.setAttribute("transform", "translate(" + x + "," + y + ")");

          var headR = size * 0.24,
            headCy = -size * 0.3;
          var head = document.createElementNS(svgns, "circle");
          head.setAttribute("cx", "0");
          head.setAttribute("cy", headCy);
          head.setAttribute("r", headR);
          head.setAttribute("class", cls);
          if (filterUrl) head.setAttribute("filter", filterUrl);
          g.appendChild(head);

          var bw = size * 0.42,
            bTop = -size * 0.02,
            bBottom = size * 0.42;
          var body = document.createElementNS(svgns, "path");
          body.setAttribute(
            "d",
            "M " +
              -bw +
              "," +
              bBottom +
              " C " +
              -bw +
              "," +
              bTop +
              " " +
              bw +
              "," +
              bTop +
              " " +
              bw +
              "," +
              bBottom +
              " Z",
          );
          body.setAttribute("class", cls);
          if (filterUrl) body.setAttribute("filter", filterUrl);
          g.appendChild(body);

          parent.appendChild(g);
          return g;
        }

        // dense background population — hundreds of small monitored-account silhouettes
        var CLEAR_COUNT = 170;
        for (var i = 0; i < CLEAR_COUNT; i++) {
          var ang = Math.random() * 360;
          var rf = Math.sqrt(Math.random()) * 0.94; // area-uniform scatter, kept inside outer ring
          var p = polar(ang, rf);
          var size = 6 + Math.random() * 3.5;
          addProfileIcon(dotLayer, p.x, p.y, size, "clear-dot");
        }

        var flagged = [
          {
            id: "4471",
            a: 20,
            r: 0.55,
            desc: "Repeated cross-border transfers just under the reporting threshold.",
          },
          {
            id: "1092",
            a: 95,
            r: 0.75,
            desc: "New beneficiary added the same day as a large outbound transfer.",
          },
          {
            id: "8830",
            a: 160,
            r: 0.4,
            desc: "Device fingerprint changed twice within one settlement cycle.",
          },
          {
            id: "3345",
            a: 210,
            r: 0.85,
            desc: "Velocity spike — 12 transfers in the last hour, all near the same amount.",
          },
          {
            id: "7719",
            a: 260,
            r: 0.6,
            desc: "Geo-mismatch — login region doesn't match the payment corridor.",
          },
          {
            id: "5502",
            a: 310,
            r: 0.5,
            desc: "Linked to two other flagged accounts via a shared beneficiary.",
          },
          {
            id: "9061",
            a: 350,
            r: 0.7,
            desc: "Structuring pattern — multiple transfers just below the $10k threshold.",
          },
        ];

        flagged.forEach(function (f) {
          var p = polar(f.a, f.r);
          var delay = ((f.a / 360) * sweepDur).toFixed(3);
          var iconSize = 24;

          var ring = document.createElementNS(svgns, "circle");
          ring.setAttribute("cx", p.x);
          ring.setAttribute("cy", p.y);
          ring.setAttribute("r", "3");
          ring.setAttribute("class", "flag-ring");
          var ringR = document.createElementNS(svgns, "animate");
          ringR.setAttribute("attributeName", "r");
          ringR.setAttribute("values", "3;20;3");
          ringR.setAttribute("keyTimes", "0;0.08;1");
          ringR.setAttribute("dur", sweepDur + "s");
          ringR.setAttribute("begin", delay + "s");
          ringR.setAttribute("repeatCount", "indefinite");
          var ringOp = document.createElementNS(svgns, "animate");
          ringOp.setAttribute("attributeName", "opacity");
          ringOp.setAttribute("values", "0.8;0;0");
          ringOp.setAttribute("keyTimes", "0;0.15;1");
          ringOp.setAttribute("dur", sweepDur + "s");
          ringOp.setAttribute("begin", delay + "s");
          ringOp.setAttribute("repeatCount", "indefinite");
          ring.appendChild(ringR);
          ring.appendChild(ringOp);
          dotLayer.appendChild(ring);

          var iconGroup = addProfileIcon(
            dotLayer,
            p.x,
            p.y,
            iconSize,
            "flag-dot",
            "url(#glow)",
          );
          var pulse = document.createElementNS(svgns, "animate");
          pulse.setAttribute("attributeName", "opacity");
          pulse.setAttribute("values", "0.6;1;0.7;0.6");
          pulse.setAttribute("keyTimes", "0;0.06;0.2;1");
          pulse.setAttribute("dur", sweepDur + "s");
          pulse.setAttribute("begin", delay + "s");
          pulse.setAttribute("repeatCount", "indefinite");
          iconGroup.appendChild(pulse);

          // permanent inline label, offset to the outside of the radar
          var labelX = p.x + (p.x >= cx ? iconSize * 0.9 : -iconSize * 0.9);
          var label = document.createElementNS(svgns, "text");
          label.setAttribute("x", labelX);
          label.setAttribute("y", p.y + 5);
          label.setAttribute("text-anchor", p.x >= cx ? "start" : "end");
          label.setAttribute("class", "radar-label");
          label.setAttribute("filter", "url(#glow)");
          label.textContent = "Acct: " + f.id;
          labelLayer.appendChild(label);

          var hit = document.createElementNS(svgns, "circle");
          hit.setAttribute("cx", p.x);
          hit.setAttribute("cy", p.y);
          hit.setAttribute("r", "16");
          hit.setAttribute("class", "flag-hit");
          hit.addEventListener("mouseenter", function () {
            infoTitle.textContent = "Account •• " + f.id;
            infoRate.textContent = "Flagged — under review";
            infoDesc.textContent = f.desc;
            infoPanel.classList.add("lit");
          });
          hit.addEventListener("mouseleave", resetInfo);
          dotLayer.appendChild(hit);
        });

        var infoPanel = document.getElementById("infoPanel");
        var infoTitle = document.getElementById("infoTitle");
        var infoRate = document.getElementById("infoRate");
        var infoDesc = document.getElementById("infoDesc");
        function resetInfo() {
          infoTitle.textContent = "Compliance Radar";
          infoRate.textContent = "Continuous anomaly scan";
          infoDesc.textContent =
            "Hover a flagged account to see why it's under active review.";
          infoPanel.classList.remove("lit");
        }

        var throughputEl = document.getElementById("throughput");
        var total = 37;
        throughputEl.innerHTML =
          total.toLocaleString() + " <span>open compliance cases</span>";
        setInterval(
          function () {
            total += 1;
            throughputEl.innerHTML =
              total.toLocaleString() + " <span>open compliance cases</span>";
          },
          4200 + Math.random() * 2600,
        );

        if (
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches
        ) {
          var svgEl = document.querySelector("svg");
          if (typeof svgEl.pauseAnimations === "function")
            svgEl.pauseAnimations();
        }
      })();
    </script>
  </body>
</html>
