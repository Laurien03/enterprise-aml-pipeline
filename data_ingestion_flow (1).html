<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Data Ingestion & Mapping — Live Flow</title>
    <style>
      :root {
        --bg-0: #050b14;
        --bg-1: #0a1420;
        --panel: #101c2e;
        --panel-border: #1e2d45;
        --cyan: #22d3ee;
        --blue: #3b82f6;
        --amber: #f5b942;
        --text-primary: #e6edf5;
        --text-muted: #6b7d99;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: radial-gradient(
          ellipse at 50% 30%,
          var(--bg-1) 0%,
          var(--bg-0) 65%
        );
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text-primary);
        overflow: hidden;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100vh;
        min-height: 520px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* faint high-tech grid texture */
      .grid-overlay {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(34, 211, 238, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(34, 211, 238, 0.045) 1px, transparent 1px);
        background-size: 36px 36px;
        mask-image: radial-gradient(
          ellipse at 50% 45%,
          black 10%,
          transparent 72%
        );
        pointer-events: none;
      }

      .header {
        position: absolute;
        top: 22px;
        left: 26px;
        line-height: 1.3;
        pointer-events: none;
      }
      .header .eyebrow {
        font-size: 12.5px;
        color: var(--text-muted);
        font-weight: 500;
      }
      .header .throughput {
        font-family:
          "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", monospace;
        font-size: 20px;
        color: var(--cyan);
        font-variant-numeric: tabular-nums;
        margin-top: 2px;
      }
      .header .throughput span {
        color: var(--text-muted);
        font-size: 13px;
        margin-left: 6px;
      }

      .info-panel {
        position: absolute;
        bottom: 22px;
        right: 26px;
        width: min(300px, 40vw);
        background: rgba(16, 28, 46, 0.82);
        border: 1px solid var(--panel-border);
        border-radius: 10px;
        padding: 14px 16px;
        backdrop-filter: blur(6px);
        transition: border-color 0.25s ease;
      }
      .info-panel.lit {
        border-color: rgba(34, 211, 238, 0.5);
      }
      .info-panel .title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 4px;
      }
      .info-panel .rate {
        font-family: "SF Mono", SFMono-Regular, Consolas, monospace;
        font-size: 13px;
        color: var(--amber);
        font-variant-numeric: tabular-nums;
        margin-bottom: 6px;
      }
      .info-panel .desc {
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--text-muted);
      }

      svg {
        width: 100%;
        height: 100%;
        max-width: 1100px;
      }

      .core-label {
        font-size: 11.5px;
        fill: var(--text-muted);
        text-anchor: middle;
      }

      .conduit {
        fill: none;
        stroke: var(--panel-border);
        stroke-width: 1.4;
        stroke-opacity: 0.9;
        transition:
          stroke 0.25s ease,
          stroke-width 0.25s ease;
      }
      .stream.active .conduit {
        stroke: var(--amber);
        stroke-width: 1.8;
      }

      .particle {
        fill: var(--cyan);
        transition: fill 0.2s ease;
      }
      .stream.active .particle {
        fill: var(--amber);
      }

      .ping {
        fill: none;
        stroke: var(--cyan);
        stroke-width: 1.2;
      }

      .node-hit {
        fill: transparent;
        cursor: pointer;
      }
      .node-panel {
        fill: var(--panel);
        stroke: var(--panel-border);
        stroke-width: 1.3;
        transition:
          stroke 0.2s ease,
          fill 0.2s ease;
      }
      .node.hot .node-panel {
        stroke: var(--amber);
        fill: #152238;
      }
      .node:focus-visible .node-panel,
      .node:focus .node-panel {
        outline: none;
        stroke: var(--amber);
        stroke-width: 2;
      }

      .node-icon {
        stroke: var(--text-primary);
      }
      .node-label {
        font-size: 11.5px;
        fill: var(--text-primary);
        text-anchor: middle;
        font-weight: 500;
      }
      .node-rate {
        font-family: "SF Mono", SFMono-Regular, Consolas, monospace;
        font-size: 10px;
        fill: var(--text-muted);
        text-anchor: middle;
        font-variant-numeric: tabular-nums;
      }

      @media (max-width: 640px) {
        .info-panel {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="grid-overlay"></div>

      <div class="header">
        <div class="eyebrow">Enterprise AML Detection Engine</div>
        <div class="throughput" id="throughput">
          1,000,000+ <span>Transactions Ingested</span>
        </div>
      </div>

      <div class="info-panel" id="infoPanel">
        <div class="title" id="infoTitle">Central Data Core</div>
        <div class="rate" id="infoRate">
          Four-stage AML pipeline, six modules
        </div>
        <div class="desc" id="infoDesc">
          Hover or focus a stage to see how it fits into the fraud-detection
          pipeline.
        </div>
      </div>

      <svg
        viewBox="0 0 1000 640"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-label="Animated diagram of a central data core streaming to six downstream systems"
      >
        <defs>
          <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
            <feGaussianBlur stdDeviation="3.2" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <linearGradient id="coreFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#16283f" />
            <stop offset="100%" stop-color="#0c1826" />
          </linearGradient>
        </defs>

        <!-- conduit paths (drawn first, beneath everything) -->
        <g id="conduits">
          <g class="stream" data-id="marketdata">
            <path id="p1" class="conduit" d="M500,330 Q540,210 500,90" />
          </g>
          <g class="stream" data-id="portfolios">
            <path id="p2" class="conduit" d="M500,330 Q640,245 690,220" />
          </g>
          <g class="stream" data-id="payments">
            <path id="p3" class="conduit" d="M500,330 Q655,365 703,448" />
          </g>
          <g class="stream" data-id="compliance">
            <path id="p4" class="conduit" d="M500,330 Q455,450 500,570" />
          </g>
          <g class="stream" data-id="cloud">
            <path id="p5" class="conduit" d="M500,330 Q350,405 310,440" />
          </g>
          <g class="stream" data-id="analytics">
            <path id="p6" class="conduit" d="M500,330 Q345,245 297,213" />
          </g>
        </g>

        <!-- radar pings from the core -->
        <g filter="url(#softGlow)" opacity="0.55">
          <circle class="ping" cx="500" cy="330" r="0">
            <animate
              attributeName="r"
              values="0;150"
              dur="3s"
              begin="0s"
              repeatCount="indefinite"
            />
            <animate
              attributeName="opacity"
              values="0.6;0"
              dur="3s"
              begin="0s"
              repeatCount="indefinite"
            />
          </circle>
          <circle class="ping" cx="500" cy="330" r="0">
            <animate
              attributeName="r"
              values="0;150"
              dur="3s"
              begin="1s"
              repeatCount="indefinite"
            />
            <animate
              attributeName="opacity"
              values="0.6;0"
              dur="3s"
              begin="1s"
              repeatCount="indefinite"
            />
          </circle>
          <circle class="ping" cx="500" cy="330" r="0">
            <animate
              attributeName="r"
              values="0;150"
              dur="3s"
              begin="2s"
              repeatCount="indefinite"
            />
            <animate
              attributeName="opacity"
              values="0.6;0"
              dur="3s"
              begin="2s"
              repeatCount="indefinite"
            />
          </circle>
        </g>

        <!-- particles travelling each conduit, staggered for a continuous stream -->
        <g id="particles" filter="url(#glow)"></g>

        <!-- central core -->
        <g filter="url(#softGlow)">
          <rect
            x="458"
            y="278"
            width="84"
            height="104"
            rx="10"
            fill="url(#coreFill)"
            stroke="var(--cyan)"
            stroke-width="1.6"
          />
          <line
            x1="470"
            y1="298"
            x2="530"
            y2="298"
            stroke="var(--panel-border)"
            stroke-width="2"
          />
          <line
            x1="470"
            y1="316"
            x2="530"
            y2="316"
            stroke="var(--panel-border)"
            stroke-width="2"
          />
          <line
            x1="470"
            y1="334"
            x2="530"
            y2="334"
            stroke="var(--panel-border)"
            stroke-width="2"
          />
          <line
            x1="470"
            y1="352"
            x2="530"
            y2="352"
            stroke="var(--panel-border)"
            stroke-width="2"
          />
          <circle cx="522" cy="298" r="2.4" fill="var(--amber)">
            <animate
              attributeName="opacity"
              values="1;0.15;1"
              dur="1.6s"
              repeatCount="indefinite"
            />
          </circle>
          <circle cx="522" cy="316" r="2.4" fill="var(--cyan)">
            <animate
              attributeName="opacity"
              values="0.2;1;0.2"
              dur="1.3s"
              repeatCount="indefinite"
            />
          </circle>
          <circle cx="522" cy="334" r="2.4" fill="var(--cyan)">
            <animate
              attributeName="opacity"
              values="1;0.2;1"
              dur="1.9s"
              repeatCount="indefinite"
            />
          </circle>
        </g>
        <text x="500" y="400" class="core-label">Central Data Core</text>

        <!-- downstream nodes -->
        <g id="nodes">
          <!-- Market Data Feed -->
          <g
            class="node"
            data-id="marketdata"
            tabindex="0"
            role="button"
            aria-label="Stage 1 data ingestion node"
            transform="translate(500,90)"
          >
            <circle class="node-panel" r="34" />
            <g class="node-icon" fill="none" stroke-width="1.5">
              <ellipse cx="0" cy="-10" rx="12" ry="4" />
              <path d="M-12,-10 V8" />
              <path d="M12,-10 V8" />
              <path d="M-12,8 A12,4 0 0,0 12,8" />
              <path d="M-12,-1 Q0,3 12,-1" stroke="var(--cyan)" />
            </g>
            <text class="node-label" y="53">Stage 1: Data Ingestion</text>
            <text class="node-rate" y="67" id="rate-marketdata">
              Clean &amp; Encoded Features
            </text>
            <circle class="node-hit" r="46" />
          </g>

          <!-- Client Portfolios -->
          <g
            class="node"
            data-id="portfolios"
            tabindex="0"
            role="button"
            aria-label="Stage 2A anomaly filter node"
            transform="translate(690,220)"
          >
            <circle class="node-panel" r="34" />
            <g class="node-icon" fill="none" stroke-width="1.5">
              <path d="M-13,-11 L13,-11 L3,3 L3,13 L-3,10 L-3,3 Z" />
              <circle
                cx="0"
                cy="16"
                r="1.6"
                fill="var(--amber)"
                stroke="none"
              />
            </g>
            <text class="node-label" y="53">Stage 2A: Anomaly Filter</text>
            <text class="node-rate" y="67" id="rate-portfolios">
              Isolation Bouncer
            </text>
            <circle class="node-hit" r="46" />
          </g>

          <!-- Payments & Settlement -->
          <g
            class="node"
            data-id="payments"
            tabindex="0"
            role="button"
            aria-label="Stage 2B graph topology node"
            transform="translate(703,448)"
          >
            <circle class="node-panel" r="34" />
            <g class="node-icon" fill="none" stroke-width="1.4">
              <line x1="-10" y1="-8" x2="9" y2="-3" />
              <line x1="-10" y1="-8" x2="-6" y2="10" />
              <line x1="9" y1="-3" x2="-6" y2="10" />
              <line x1="9" y1="-3" x2="10" y2="9" />
              <line x1="-6" y1="10" x2="10" y2="9" />
              <circle cx="-10" cy="-8" r="3" fill="var(--cyan)" stroke="none" />
              <circle cx="9" cy="-3" r="3" fill="var(--cyan)" stroke="none" />
              <circle cx="-6" cy="10" r="3" fill="var(--cyan)" stroke="none" />
              <circle cx="10" cy="9" r="3" fill="var(--cyan)" stroke="none" />
            </g>
            <text class="node-label" y="53">Stage 2B: Graph Topology</text>
            <text class="node-rate" y="67" id="rate-payments">
              NetworkX Centrality
            </text>
            <circle class="node-hit" r="46" />
          </g>

          <!-- Compliance & Risk -->
          <g
            class="node"
            data-id="compliance"
            tabindex="0"
            role="button"
            aria-label="Stage 3A XGBoost model node"
            transform="translate(500,570)"
          >
            <circle class="node-panel" r="34" />
            <g class="node-icon" fill="none" stroke-width="1.4">
              <line x1="0" y1="-11" x2="-9" y2="-1" />
              <line x1="0" y1="-11" x2="9" y2="-1" />
              <line x1="-9" y1="1" x2="-14" y2="12" />
              <line x1="-9" y1="1" x2="-4" y2="12" />
              <line x1="9" y1="1" x2="4" y2="12" />
              <line x1="9" y1="1" x2="14" y2="12" />
              <circle
                cx="0"
                cy="-13"
                r="2.6"
                fill="var(--cyan)"
                stroke="none"
              />
              <circle
                cx="-9"
                cy="-1"
                r="2.6"
                fill="var(--cyan)"
                stroke="none"
              />
              <circle cx="9" cy="-1" r="2.6" fill="var(--cyan)" stroke="none" />
              <circle
                cx="-14"
                cy="13"
                r="2.2"
                fill="var(--amber)"
                stroke="none"
              />
              <circle
                cx="-4"
                cy="13"
                r="2.2"
                fill="var(--amber)"
                stroke="none"
              />
              <circle
                cx="4"
                cy="13"
                r="2.2"
                fill="var(--amber)"
                stroke="none"
              />
              <circle
                cx="14"
                cy="13"
                r="2.2"
                fill="var(--amber)"
                stroke="none"
              />
            </g>
            <text class="node-label" y="53">Stage 3A: XGBoost Model</text>
            <text class="node-rate" y="67" id="rate-compliance">
              Tabular Fraud Detective
            </text>
            <circle class="node-hit" r="46" />
          </g>

          <!-- Cloud Archive -->
          <g
            class="node"
            data-id="cloud"
            tabindex="0"
            role="button"
            aria-label="Stage 3B GraphSAGE GNN node"
            transform="translate(310,440)"
          >
            <circle class="node-panel" r="34" />
            <g class="node-icon" fill="none" stroke-width="1.1">
              <line x1="-12" y1="-10" x2="0" y2="-12" />
              <line x1="-12" y1="-10" x2="0" y2="0" />
              <line x1="-12" y1="-10" x2="0" y2="12" />
              <line x1="-12" y1="0" x2="0" y2="-12" />
              <line x1="-12" y1="0" x2="0" y2="0" />
              <line x1="-12" y1="0" x2="0" y2="12" />
              <line x1="-12" y1="10" x2="0" y2="-12" />
              <line x1="-12" y1="10" x2="0" y2="0" />
              <line x1="-12" y1="10" x2="0" y2="12" />
              <line x1="0" y1="-12" x2="12" y2="0" />
              <line x1="0" y1="0" x2="12" y2="0" />
              <line x1="0" y1="12" x2="12" y2="0" />
              <circle
                cx="-12"
                cy="-10"
                r="2.2"
                fill="var(--cyan)"
                stroke="none"
              />
              <circle
                cx="-12"
                cy="0"
                r="2.2"
                fill="var(--cyan)"
                stroke="none"
              />
              <circle
                cx="-12"
                cy="10"
                r="2.2"
                fill="var(--cyan)"
                stroke="none"
              />
              <circle
                cx="0"
                cy="-12"
                r="2.2"
                fill="var(--cyan)"
                stroke="none"
              />
              <circle cx="0" cy="0" r="2.2" fill="var(--cyan)" stroke="none" />
              <circle cx="0" cy="12" r="2.2" fill="var(--cyan)" stroke="none" />
              <circle
                cx="12"
                cy="0"
                r="2.8"
                fill="var(--amber)"
                stroke="none"
              />
            </g>
            <text class="node-label" y="53">Stage 3B: GraphSAGE GNN</text>
            <text class="node-rate" y="67" id="rate-cloud">
              Spatial Message Passing
            </text>
            <circle class="node-hit" r="46" />
          </g>

          <!-- Analytics Engine -->
          <g
            class="node"
            data-id="analytics"
            tabindex="0"
            role="button"
            aria-label="Stage 4 risk fusion node"
            transform="translate(297,213)"
          >
            <circle class="node-panel" r="34" />
            <g class="node-icon" fill="none" stroke-width="1.3">
              <circle cx="0" cy="0" r="13" />
              <circle cx="0" cy="0" r="7.5" />
              <line x1="0" y1="-16" x2="0" y2="-13" />
              <line x1="0" y1="16" x2="0" y2="13" />
              <line x1="-16" y1="0" x2="-13" y2="0" />
              <line x1="16" y1="0" x2="13" y2="0" />
              <circle cx="0" cy="0" r="2.4" fill="var(--amber)" stroke="none" />
            </g>
            <text class="node-label" y="53">Stage 4: Risk Fusion</text>
            <text class="node-rate" y="67" id="rate-analytics">
              Compliance &amp; String Board
            </text>
            <circle class="node-hit" r="46" />
          </g>
        </g>
      </svg>
    </div>

    <script>
      (function () {
        var svgns = "http://www.w3.org/2000/svg";
        var svg = document.querySelector("svg");
        var particleLayer = document.getElementById("particles");

        var nodeData = {
          marketdata: {
            title: "Stage 1: Data Ingestion",
            tag: "Clean & Encoded Features",
            desc: "Raw transaction and KYC records are cleaned, normalized, and encoded into structured feature vectors.",
          },
          portfolios: {
            title: "Stage 2A: Anomaly Filter",
            tag: "Isolation Bouncer",
            desc: "An isolation-forest style filter flags statistical outliers before they reach the heavier models downstream.",
          },
          payments: {
            title: "Stage 2B: Graph Topology",
            tag: "NetworkX Centrality",
            desc: "Builds the transaction graph and computes centrality and clustering metrics to expose laundering rings.",
          },
          compliance: {
            title: "Stage 3A: XGBoost Model",
            tag: "Tabular Fraud Detective",
            desc: "A gradient-boosted tree model scores each transaction's tabular features for fraud probability.",
          },
          cloud: {
            title: "Stage 3B: GraphSAGE GNN",
            tag: "Spatial Message Passing",
            desc: "Fuses 2-hop neighbor embeddings with XGBoost probabilities for risk-based tiering.",
          },
          analytics: {
            title: "Stage 4: Risk Fusion",
            tag: "Compliance & String Board",
            desc: "Combines model outputs and analyst annotations into a single compliance-ready risk score.",
          },
        };

        // build particles for each conduit path, staggered
        var pathIds = ["p1", "p2", "p3", "p4", "p5", "p6"];
        pathIds.forEach(function (pid) {
          var count = 3;
          for (var i = 0; i < count; i++) {
            var circle = document.createElementNS(svgns, "circle");
            circle.setAttribute("r", "3.4");
            circle.setAttribute("class", "particle");

            var anim = document.createElementNS(svgns, "animateMotion");
            anim.setAttribute(
              "dur",
              (2.2 + Math.random() * 0.6).toFixed(2) + "s",
            );
            anim.setAttribute("repeatCount", "indefinite");
            anim.setAttribute("begin", (i * 0.8).toFixed(2) + "s");
            anim.setAttribute("rotate", "auto");

            var mpath = document.createElementNS(svgns, "mpath");
            mpath.setAttributeNS(
              "http://www.w3.org/1999/xlink",
              "href",
              "#" + pid,
            );
            anim.appendChild(mpath);
            circle.appendChild(anim);
            particleLayer.appendChild(circle);
          }
        });

        // hover / focus interactivity
        var infoPanel = document.getElementById("infoPanel");
        var infoTitle = document.getElementById("infoTitle");
        var infoRate = document.getElementById("infoRate");
        var infoDesc = document.getElementById("infoDesc");

        function setActive(id) {
          document.querySelectorAll(".stream").forEach(function (s) {
            s.classList.toggle("active", s.getAttribute("data-id") === id);
          });
          document.querySelectorAll(".node").forEach(function (n) {
            n.classList.toggle("hot", n.getAttribute("data-id") === id);
          });
          if (id && nodeData[id]) {
            var d = nodeData[id];
            infoTitle.textContent = d.title;
            infoRate.textContent = d.tag;
            infoDesc.textContent = d.desc;
            infoPanel.classList.add("lit");
          }
        }
        function clearActive() {
          document.querySelectorAll(".stream").forEach(function (s) {
            s.classList.remove("active");
          });
          document.querySelectorAll(".node").forEach(function (n) {
            n.classList.remove("hot");
          });
          infoTitle.textContent = "Central Data Core";
          infoRate.textContent = "Four-stage AML pipeline, six modules";
          infoDesc.textContent =
            "Hover or focus a stage to see how it fits into the fraud-detection pipeline.";
          infoPanel.classList.remove("lit");
        }

        document.querySelectorAll(".node").forEach(function (node) {
          var id = node.getAttribute("data-id");
          node.addEventListener("mouseenter", function () {
            setActive(id);
          });
          node.addEventListener("mouseleave", clearActive);
          node.addEventListener("focus", function () {
            setActive(id);
          });
          node.addEventListener("blur", clearActive);
        });

        // header throughput counter
        var throughputEl = document.getElementById("throughput");
        var total = 1000000;
        setInterval(function () {
          total += Math.floor(40 + Math.random() * 90);
          throughputEl.innerHTML =
            total.toLocaleString() + "+ <span>Transactions Ingested</span>";
        }, 1000);

        // respect reduced-motion preference
        if (
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches
        ) {
          if (typeof svg.pauseAnimations === "function") svg.pauseAnimations();
        }
      })();
    </script>
  </body>
</html>
