<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>XGBoost — Tabular Engine</title>
    <style>
      :root {
        --bg-0: #050b14;
        --bg-1: #0a1420;
        --panel: #101c2e;
        --panel-border: #1e2d45;
        --cyan: #22d3ee;
        --blue: #3b82f6;
        --blue-dark: #0f2038;
        --blue-light: #9dc4ff;
        --amber: #f5b942;
        --text-primary: #e6edf5;
        --text-muted: #6b7d99;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: radial-gradient(
          ellipse at 50% 18%,
          var(--bg-1) 0%,
          var(--bg-0) 65%
        );
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text-primary);
        overflow: hidden;
      }
      .stage {
        position: relative;
        width: 100%;
        height: 100vh;
        min-height: 520px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .grid-overlay {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(34, 211, 238, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(34, 211, 238, 0.045) 1px, transparent 1px);
        background-size: 36px 36px;
        mask-image: radial-gradient(
          ellipse at 50% 38%,
          black 10%,
          transparent 72%
        );
        pointer-events: none;
      }
      .header {
        position: absolute;
        top: 22px;
        left: 26px;
        line-height: 1.3;
        pointer-events: none;
      }
      .header .eyebrow {
        font-size: 12.5px;
        color: var(--text-muted);
        font-weight: 500;
      }
      .header .throughput {
        font-family:
          "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", monospace;
        font-size: 20px;
        color: var(--cyan);
        font-variant-numeric: tabular-nums;
        margin-top: 2px;
      }
      .header .throughput span {
        color: var(--text-muted);
        font-size: 13px;
        margin-left: 6px;
      }
      .info-panel {
        position: absolute;
        bottom: 22px;
        right: 26px;
        width: min(300px, 40vw);
        background: rgba(16, 28, 46, 0.82);
        border: 1px solid var(--panel-border);
        border-radius: 10px;
        padding: 14px 16px;
        backdrop-filter: blur(6px);
        transition: border-color 0.25s ease;
      }
      .info-panel.lit {
        border-color: rgba(245, 185, 66, 0.55);
      }
      .info-panel .title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 4px;
      }
      .info-panel .rate {
        font-family: "SF Mono", SFMono-Regular, Consolas, monospace;
        font-size: 13px;
        color: var(--amber);
        margin-bottom: 6px;
      }
      .info-panel .desc {
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--text-muted);
      }
      svg {
        width: 100%;
        height: 100%;
        max-width: 1300px;
      }
      .edge {
        fill: none;
        stroke: var(--panel-border);
        stroke-width: 1.2;
        stroke-opacity: 0.85;
      }
      .split-label {
        font-family: "SF Mono", SFMono-Regular, Consolas, monospace;
        font-size: 13px;
        fill: var(--cyan);
        text-anchor: middle;
        letter-spacing: 0.3px;
      }
      .particle {
        fill: var(--cyan);
      }
      .decision {
        fill: var(--panel);
        stroke: var(--cyan);
        stroke-width: 1.8;
        cursor: pointer;
        transition: stroke 0.2s ease;
      }
      .decision.hover-lit {
        stroke: var(--amber);
      }
      .leaf-box {
        stroke-width: 1.4;
        cursor: pointer;
      }
      .leaf-box.flagged {
        fill: rgba(245, 185, 66, 0.22);
        stroke: var(--amber);
      }
      .leaf-box.clear {
        fill: var(--blue-dark);
        stroke: var(--blue);
      }
      .leaf-text {
        font-size: 12px;
        text-anchor: middle;
        font-weight: 700;
      }
      .leaf-text.flagged {
        fill: var(--amber);
      }
      .leaf-text.clear {
        fill: var(--blue-light);
      }
      .hit {
        fill: transparent;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="grid-overlay"></div>

      <div class="header">
        <div class="eyebrow">Stage 3A · XGBoost Tabular Engine</div>
        <div class="throughput" id="throughput">
          0 <span>transactions scored</span>
        </div>
      </div>

      <div class="info-panel" id="infoPanel">
        <div class="title" id="infoTitle">Tabular Decision Ensemble</div>
        <div class="rate" id="infoRate">Gradient-boosted feature splits</div>
        <div class="desc" id="infoDesc">
          Hover a leaf to see how that path scored, or a split to see the
          feature it tested.
        </div>
      </div>

      <svg
        viewBox="0 0 1500 760"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-label="Large-scale animated decision tree cascading transaction features down into flagged and clear leaf nodes"
      >
        <defs>
          <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
            <feGaussianBlur stdDeviation="2.8" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <g id="edgeLayer"></g>
        <g id="particleLayer" filter="url(#glow)"></g>
        <g id="splitLabelLayer" filter="url(#glow)"></g>
        <g id="decisionLayer"></g>
        <g id="leafLayer"></g>
      </svg>
    </div>

    <script>
      (function () {
        var svgns = "http://www.w3.org/2000/svg";
        var edgeLayer = document.getElementById("edgeLayer");
        var particleLayer = document.getElementById("particleLayer");
        var splitLabelLayer = document.getElementById("splitLabelLayer");
        var decisionLayer = document.getElementById("decisionLayer");
        var leafLayer = document.getElementById("leafLayer");

        // 5-level binary tree, scaled up spacing: root, L1(2), L2(4), L3(8), leaves(16)
        var rootX = 750;
        var spreads = [320, 170, 90, 48];
        var ys = [70, 220, 370, 520, 680];
        var xLevels = [[rootX]];
        spreads.forEach(function (spread, d) {
          var next = [];
          xLevels[d].forEach(function (x) {
            next.push(x - spread, x + spread);
          });
          xLevels.push(next);
        });

        var splitLabels = {
          "0-0-0": "amount > $8,400",
          "0-0-1": "velocity_1h > 5",
          "1-0-0": "cross_border = true",
          "1-0-1": "new_beneficiary",
          "1-1-2": "device_change",
          "1-1-3": "geo_mismatch",
        };

        var leafInfo = [
          {
            flagged: true,
            prob: "0.95 fraud probability",
            desc: "Large domestic transfer with rapid repeat velocity — escalated immediately.",
          },
          {
            flagged: false,
            prob: "0.03 fraud probability",
            desc: "Small, recurring domestic payment matching prior behavior.",
          },
          {
            flagged: false,
            prob: "0.06 fraud probability",
            desc: "Established payee, amount within normal range.",
          },
          {
            flagged: true,
            prob: "0.89 fraud probability",
            desc: "High amount paired with a brand-new beneficiary — held for review.",
          },
          {
            flagged: false,
            prob: "0.08 fraud probability",
            desc: "Domestic transfer, moderate amount, no velocity flags.",
          },
          {
            flagged: false,
            prob: "0.05 fraud probability",
            desc: "Routine bill payment to a long-standing payee.",
          },
          {
            flagged: false,
            prob: "0.10 fraud probability",
            desc: "Slight velocity uptick but within seasonal norms.",
          },
          {
            flagged: true,
            prob: "0.87 fraud probability",
            desc: "Cross-border transfer combined with a device change — compliance hold.",
          },
          {
            flagged: false,
            prob: "0.07 fraud probability",
            desc: "Cross-border but consistent with the account's usual corridor.",
          },
          {
            flagged: true,
            prob: "0.92 fraud probability",
            desc: "New beneficiary plus geo-mismatch — routed to a human reviewer.",
          },
          {
            flagged: false,
            prob: "0.04 fraud probability",
            desc: "Matches the account's established geographic pattern.",
          },
          {
            flagged: false,
            prob: "0.09 fraud probability",
            desc: "Minor cross-border activity, low amount, no other flags.",
          },
          {
            flagged: true,
            prob: "0.90 fraud probability",
            desc: "Device change and velocity spike occurring together — flagged.",
          },
          {
            flagged: false,
            prob: "0.06 fraud probability",
            desc: "Familiar device, stable transaction cadence.",
          },
          {
            flagged: false,
            prob: "0.11 fraud probability",
            desc: "New device but amount and velocity both low-risk.",
          },
          {
            flagged: true,
            prob: "0.93 fraud probability",
            desc: "Geo-mismatch, new beneficiary, and high amount stacking together.",
          },
        ];

        var edges = [];
        for (var d = 0; d < xLevels.length - 1; d++) {
          xLevels[d].forEach(function (px, pi) {
            [2 * pi, 2 * pi + 1].forEach(function (ci) {
              edges.push({
                x1: px,
                y1: ys[d],
                x2: xLevels[d + 1][ci],
                y2: ys[d + 1],
                key: d + "-" + pi + "-" + ci,
              });
            });
          });
        }

        edges.forEach(function (e, idx) {
          var pid = "tedge" + idx;
          var path = document.createElementNS(svgns, "path");
          path.setAttribute("id", pid);
          path.setAttribute("class", "edge");
          path.setAttribute(
            "d",
            "M" + e.x1 + "," + e.y1 + " L" + e.x2 + "," + e.y2,
          );
          edgeLayer.appendChild(path);

          var label = splitLabels[e.key];
          if (label) {
            var t = document.createElementNS(svgns, "text");
            t.setAttribute("x", (e.x1 + e.x2) / 2 + (e.x2 > e.x1 ? 46 : -46));
            t.setAttribute("y", (e.y1 + e.y2) / 2 - 8);
            t.setAttribute("class", "split-label");
            t.textContent = label;
            splitLabelLayer.appendChild(t);
          }

          for (var i = 0; i < 2; i++) {
            var p = document.createElementNS(svgns, "circle");
            p.setAttribute("r", "3.2");
            p.setAttribute("class", "particle");
            var anim = document.createElementNS(svgns, "animateMotion");
            anim.setAttribute(
              "dur",
              (0.65 + Math.random() * 0.45).toFixed(2) + "s",
            );
            anim.setAttribute("repeatCount", "indefinite");
            anim.setAttribute("begin", (Math.random() * 1.2).toFixed(2) + "s");
            var mpath = document.createElementNS(svgns, "mpath");
            mpath.setAttributeNS(
              "http://www.w3.org/1999/xlink",
              "href",
              "#" + pid,
            );
            anim.appendChild(mpath);
            p.appendChild(anim);
            particleLayer.appendChild(p);
          }
        });

        // decision nodes: root + levels 1-4 (not the leaves), oversized diamonds
        for (var d = 0; d < xLevels.length - 1; d++) {
          xLevels[d].forEach(function (x) {
            var y = ys[d];
            var size = d === 0 ? 20 : 15;
            var pd =
              "M" +
              x +
              "," +
              (y - size) +
              " L" +
              (x + size) +
              "," +
              y +
              " L" +
              x +
              "," +
              (y + size) +
              " L" +
              (x - size) +
              "," +
              y +
              " Z";
            var poly = document.createElementNS(svgns, "path");
            poly.setAttribute("d", pd);
            poly.setAttribute("class", "decision");
            poly.setAttribute("filter", "url(#glow)");
            var hit = document.createElementNS(svgns, "circle");
            hit.setAttribute("cx", x);
            hit.setAttribute("cy", y);
            hit.setAttribute("r", "28");
            hit.setAttribute("class", "hit");
            hit.addEventListener(
              "mouseenter",
              (function (pl) {
                return function () {
                  pl.classList.add("hover-lit");
                  infoTitle.textContent = "Decision split";
                  infoRate.textContent = "Feature threshold test";
                  infoDesc.textContent =
                    "Each split tests one tabular feature and routes the transaction left or right down the tree.";
                  infoPanel.classList.add("lit");
                };
              })(poly),
            );
            hit.addEventListener(
              "mouseleave",
              (function (pl) {
                return function () {
                  pl.classList.remove("hover-lit");
                  resetInfo();
                };
              })(poly),
            );
            decisionLayer.appendChild(poly);
            decisionLayer.appendChild(hit);
          });
        }

        // leaf nodes (deepest level), scaled-up terminal blocks
        var leafLevel = xLevels.length - 1;
        xLevels[leafLevel].forEach(function (x, i) {
          var y = ys[leafLevel];
          var info = leafInfo[i];
          var rect = document.createElementNS(svgns, "rect");
          rect.setAttribute("x", x - 36);
          rect.setAttribute("y", y - 18);
          rect.setAttribute("width", "72");
          rect.setAttribute("height", "36");
          rect.setAttribute("rx", "7");
          rect.setAttribute(
            "class",
            "leaf-box " + (info.flagged ? "flagged" : "clear"),
          );
          if (info.flagged) {
            var op = document.createElementNS(svgns, "animate");
            op.setAttribute("attributeName", "opacity");
            op.setAttribute("values", "1;0.55;1");
            op.setAttribute(
              "dur",
              (1.5 + Math.random() * 0.6).toFixed(2) + "s",
            );
            op.setAttribute("repeatCount", "indefinite");
            rect.appendChild(op);
          }
          leafLayer.appendChild(rect);

          var text = document.createElementNS(svgns, "text");
          text.setAttribute("x", x);
          text.setAttribute("y", y + 4.5);
          text.setAttribute(
            "class",
            "leaf-text " + (info.flagged ? "flagged" : "clear"),
          );
          text.textContent = info.flagged ? "Flagged" : "Clear";
          leafLayer.appendChild(text);

          var hit = document.createElementNS(svgns, "rect");
          hit.setAttribute("x", x - 38);
          hit.setAttribute("y", y - 24);
          hit.setAttribute("width", "76");
          hit.setAttribute("height", "48");
          hit.setAttribute("class", "hit");
          hit.addEventListener("mouseenter", function () {
            infoTitle.textContent = info.flagged
              ? "Leaf — flagged"
              : "Leaf — clear";
            infoRate.textContent = info.prob;
            infoDesc.textContent = info.desc;
            infoPanel.classList.add("lit");
          });
          hit.addEventListener("mouseleave", resetInfo);
          leafLayer.appendChild(hit);
        });

        var infoPanel = document.getElementById("infoPanel");
        var infoTitle = document.getElementById("infoTitle");
        var infoRate = document.getElementById("infoRate");
        var infoDesc = document.getElementById("infoDesc");
        function resetInfo() {
          infoTitle.textContent = "Tabular Decision Ensemble";
          infoRate.textContent = "Gradient-boosted feature splits";
          infoDesc.textContent =
            "Hover a leaf to see how that path scored, or a split to see the feature it tested.";
          infoPanel.classList.remove("lit");
        }

        var throughputEl = document.getElementById("throughput");
        var total = 0;
        setInterval(function () {
          total += Math.floor(1400 + Math.random() * 2600);
          throughputEl.innerHTML =
            total.toLocaleString() + " <span>transactions scored</span>";
        }, 450);

        if (
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches
        ) {
          var svgEl = document.querySelector("svg");
          if (typeof svgEl.pauseAnimations === "function")
            svgEl.pauseAnimations();
        }
      })();
    </script>
  </body>
</html>
